<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>거래명세서</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111;
      font-family: Arial, "Malgun Gothic", sans-serif;
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button {
      height: 34px;
      border: 1px solid #bbb;
      background: #fff;
      padding: 0 10px;
      font-size: 13px;
    }

    .toolbar button {
      cursor: pointer;
      font-weight: 700;
    }

    .toolbar button.primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .status {
      padding: 8px 12px;
      color: #555;
      font-size: 12px;
    }

    .paper-wrap {
      padding: 18px;
      overflow-x: auto;
    }

    .paper {
      width: 190mm;
      min-height: 277mm;
      margin: 0 auto;
      background: #fff;
      padding: 7mm;
      border: 1px solid #ddd;
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 8px;
      margin: 2mm 0 8mm;
      text-decoration: underline;
      text-underline-offset: 7px;
    }

    .top-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5mm;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid #222;
      height: 26px;
      padding: 3px 6px;
      vertical-align: middle;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    th {
      text-align: center;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }

    .info-title {
      text-align: center;
      font-weight: 800;
      height: 26px;
    }

    .label {
      width: 26%;
      text-align: center;
      font-weight: 800;
      background: #fff;
    }

    .amount-bar {
      margin-top: 8px;
      margin-bottom: 0;
    }

    .amount-bar td {
      height: 30px;
      font-weight: 800;
    }

    .amount-label {
      width: 22%;
      text-align: center;
    }

    .amount-korean {
      text-align: right;
      padding-right: 12px;
    }

    .amount-number {
      width: 26%;
      text-align: right;
      padding-right: 8px;
    }

    .items th,
    .items td {
      height: 24px;
    }

    .items .no { width: 6%; text-align: center; }
    .items .date { width: 13%; text-align: center; }
    .items .name { width: 31%; }
    .items .type { width: 12%; text-align: center; }
    .items .qty { width: 8%; text-align: right; }
    .items .money { width: 15%; text-align: right; }

    .summary-wrap {
      display: grid;
      grid-template-columns: 1fr 64mm;
      margin-top: -1px;
    }

    .summary-empty {
      border: 1px solid #222;
      border-top: 0;
      min-height: 58px;
    }

    .summary td {
      height: 25px;
      font-weight: 800;
    }

    .summary .sum-label {
      width: 38%;
      text-align: center;
    }

    .summary .sum-money {
      text-align: right;
      padding-right: 8px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 40px 0;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 7mm;
      }

      body {
        background: #fff;
      }

      .toolbar,
      .status {
        display: none !important;
      }

      .paper-wrap {
        padding: 0;
        overflow: visible;
      }

      .paper {
        width: 196mm;
        min-height: auto;
        margin: 0;
        padding: 0;
        border: 0;
      }
    }

    @media (max-width: 760px) {
      .paper-wrap {
        padding: 10px;
      }

      .paper {
        width: 190mm;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="monthInput" type="month" />
    <button class="primary" onclick="loadMonth()">파일 생성하기</button>
    <select id="groupSelect" onchange="renderStatement()">
      <option value="">거래처/담당자 선택</option>
    </select>
    <button onclick="window.print()">PDF 다운로드 받기</button>
  </div>

  <div id="status" class="status">월을 선택한 뒤 파일 생성하기를 눌러줘.</div>

  <div class="paper-wrap">
    <div id="paper" class="paper">
      <div class="empty">거래명세서가 여기에 표시됩니다.</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIjy992knS4x3_pRks1F_aZIrLU1GfyDVQsomsPG4anq0Rf6rclj0V-VurTYBQJz69/exec';

    const state = {
      month: '',
      sites: [],
      groups: [],
    };

    const $ = (id) => document.getElementById(id);

    init();

    function init() {
      const now = new Date();
      $('monthInput').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    async function loadMonth() {
      state.month = $('monthInput').value;
      if (!state.month) {
        setStatus('월을 먼저 선택해줘.');
        return;
      }

      setStatus('노션 데이터를 불러오는 중...');
      $('groupSelect').innerHTML = '<option value="">거래처/담당자 선택</option>';
      $('paper').innerHTML = '<div class="empty">불러오는 중...</div>';

      try {
        const url = `${WEB_APP_URL}?action=sites&month=${encodeURIComponent(state.month)}`;
        const data = await fetchJson(url);

        if (!data.ok) throw new Error(data.error || '데이터를 불러오지 못했습니다.');

        state.sites = Array.isArray(data.sites) ? data.sites : [];
        state.groups = buildGroups(state.sites);

        renderGroupOptions();

        if (state.groups.length) {
          $('groupSelect').value = state.groups[0].key;
          renderStatement();
          setStatus(`${state.month} / ${state.groups.length}개 거래처·담당자 그룹`);
        } else {
          $('paper').innerHTML = '<div class="empty">해당 월 데이터가 없습니다.</div>';
          setStatus('해당 월 데이터가 없습니다.');
        }
      } catch (err) {
        $('paper').innerHTML = '<div class="empty">오류가 발생했습니다.</div>';
        setStatus(err.message || String(err));
      }
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error('Apps Script 응답이 JSON이 아닙니다: ' + text.slice(0, 120));
      }
    }

    function buildGroups(sites) {
      const map = new Map();

      sites.forEach((site) => {
        const contacts = Array.isArray(site.contacts) ? site.contacts : [];
        const targets = contacts.length ? contacts : [{ id: 'none', name: '미지정', type: '', phone: '' }];

        targets.forEach((contact) => {
          const key = contact.id || contact.name || 'none';

          if (!map.has(key)) {
            map.set(key, {
              key,
              contact,
              sites: [],
            });
          }

          map.get(key).sites.push(site);
        });
      });

      return Array.from(map.values()).sort((a, b) => {
        return String(a.contact.name || '').localeCompare(String(b.contact.name || ''), 'ko');
      });
    }

    function renderGroupOptions() {
      const options = ['<option value="">거래처/담당자 선택</option>'];

      state.groups.forEach((group) => {
        const label = `${group.contact.name || '미지정'}${group.contact.type ? ' / ' + group.contact.type : ''}`;
        options.push(`<option value="${escapeHtml(group.key)}">${escapeHtml(label)}</option>`);
      });

      $('groupSelect').innerHTML = options.join('');
    }

    function renderStatement() {
      const key = $('groupSelect').value;
      const group = state.groups.find((item) => item.key === key);

      if (!group) {
        $('paper').innerHTML = '<div class="empty">거래처/담당자를 선택해줘.</div>';
        return;
      }

      const rows = buildRows(group.sites);
      const supply = rows.reduce((sum, row) => sum + row.supplyAmount, 0);
      const vat = Math.round(supply * 0.1);
      const total = supply + vat;

      const customerName = group.contact.name || '';
      const customerPhone = group.contact.phone || '';

      $('paper').innerHTML = `
        <div class="title">거래명세서</div>

        <div class="top-line">
          <div>날짜 : ${formatKoreanDate(new Date())}</div>
          <div>정산월 : ${escapeHtml(state.month)}</div>
        </div>

        <div class="info-grid">
          <table>
            <tr><th class="info-title" colspan="4">공급받는자</th></tr>
            <tr>
              <td class="label">상호</td>
              <td colspan="3">${escapeHtml(customerName)}</td>
            </tr>
            <tr>
              <td class="label">담당자</td>
              <td>${escapeHtml(customerName)}</td>
              <td class="label">전화번호</td>
              <td>${escapeHtml(customerPhone)}</td>
            </tr>
            <tr>
              <td class="label">주소</td>
              <td colspan="3"></td>
            </tr>
          </table>

          <table>
            <tr><th class="info-title" colspan="4">공급자</th></tr>
            <tr>
              <td class="label">사업자번호</td>
              <td colspan="3"></td>
            </tr>
            <tr>
              <td class="label">상호</td>
              <td>보양의 신</td>
              <td class="label">대표자</td>
              <td></td>
            </tr>
            <tr>
              <td class="label">전화번호</td>
              <td colspan="3"></td>
            </tr>
            <tr>
              <td class="label">주소</td>
              <td colspan="3"></td>
            </tr>
          </table>
        </div>

        <table class="amount-bar">
          <tr>
            <td class="amount-label">합계금액 :</td>
            <td class="amount-korean">${escapeHtml(numberToKorean(total))} 원 정</td>
            <td class="amount-number">₩ ${formatMoney(total)}</td>
          </tr>
        </table>

        <table class="items">
          <thead>
            <tr>
              <th class="no">No</th>
              <th class="date">날짜</th>
              <th class="name">청구내역</th>
              <th class="type">작업구분</th>
              <th class="qty">수량</th>
              <th class="money">공급가</th>
              <th class="money">부가세</th>
              <th class="money">총금액</th>
            </tr>
          </thead>
          <tbody>
            ${renderRows(rows)}
          </tbody>
        </table>

        <div class="summary-wrap">
          <div class="summary-empty"></div>
          <table class="summary">
            <tr>
              <td class="sum-label">공급가</td>
              <td class="sum-money">₩ ${formatMoney(supply)}</td>
            </tr>
            <tr>
              <td class="sum-label">부가세</td>
              <td class="sum-money">₩ ${formatMoney(vat)}</td>
            </tr>
            <tr>
              <td class="sum-label">합계금액</td>
              <td class="sum-money">₩ ${formatMoney(total)}</td>
            </tr>
          </table>
        </div>
      `;
    }

function buildRows(sites) {
  return sites
    .filter((site) => site.paid !== true)
    .map((site, index) => {
      const supplyAmount = Number(site.totalAmount || 0);
      const vat = Math.round(supplyAmount * 0.1);

      return {
        no: index + 1,
        date: site.slipDate || site.startDate || '',
        name: site.title || '',
        type: arrayText(site.items) || site.constructionType || '',
        quantity: 1,
        supplyAmount,
        vat,
        total: supplyAmount + vat,
      };
    });
}

    function renderRows(rows) {
      const visibleRows = rows.slice();
      while (visibleRows.length < 14) {
        visibleRows.push(null);
      }

      return visibleRows.map((row) => {
        if (!row) {
          return `
            <tr>
              <td class="no"></td>
              <td class="date"></td>
              <td class="name"></td>
              <td class="type"></td>
              <td class="qty"></td>
              <td class="money">-</td>
              <td class="money">-</td>
              <td class="money">-</td>
            </tr>
          `;
        }

        return `
          <tr>
            <td class="no">${row.no}</td>
            <td class="date">${escapeHtml(formatShortDate(row.date))}</td>
            <td class="name">${escapeHtml(row.name)}</td>
            <td class="type">${escapeHtml(row.type)}</td>
            <td class="qty">${row.quantity}</td>
            <td class="money">₩ ${formatMoney(row.supplyAmount)}</td>
            <td class="money">₩ ${formatMoney(row.vat)}</td>
            <td class="money">₩ ${formatMoney(row.total)}</td>
          </tr>
        `;
      }).join('');
    }

    function arrayText(value) {
      return Array.isArray(value) ? value.join(', ') : String(value || '');
    }

    function formatMoney(value) {
      return Math.round(Number(value || 0)).toLocaleString('ko-KR');
    }

    function formatShortDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function formatKoreanDate(date) {
      return `${date.getFullYear()}년 ${String(date.getMonth() + 1).padStart(2, '0')}월 ${String(date.getDate()).padStart(2, '0')}일`;
    }

    function numberToKorean(value) {
      const num = Math.round(Number(value || 0));
      if (!num) return '영';

      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const small = ['', '십', '백', '천'];
      const big = ['', '만', '억', '조'];
      const parts = [];
      let source = String(num);
      let groupIndex = 0;

      while (source.length > 0) {
        const chunk = source.slice(-4);
        source = source.slice(0, -4);

        let text = '';
        const padded = chunk.padStart(4, '0');

        for (let i = 0; i < 4; i++) {
          const n = Number(padded[i]);
          if (!n) continue;
          text += digits[n] + small[3 - i];
        }

        if (text) {
          parts.unshift(text + big[groupIndex]);
        }

        groupIndex++;
      }

      return parts.join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setStatus(message) {
      $('status').textContent = message;
    }
  </script>
</body>
</html>
