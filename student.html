<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학원 자동화 실행기</title>
<style>
  :root {
    --ink: #1c1b1a;
    --paper: #faf8f4;
    --line: #ddd8cf;
    --muted: #8a8478;
    --accent: #2f5d50;
    --accent-soft: #e4ede9;
    --error: #b3441e;
    --error-soft: #f6e6df;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(28, 27, 26, 0.04);
  }

  .card-header {
    padding: 28px 28px 0;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }

  h1 {
    font-size: 21px;
    margin: 0 0 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 0 28px;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    flex: 1;
    border: none;
    background: none;
    padding: 12px 4px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .body {
    padding: 24px 28px 28px;
  }

  .tab-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  button.run {
    width: 100%;
    margin-top: 18px;
    padding: 13px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button.run:hover { background: #254b40; }
  button.run:active { transform: scale(0.99); }
  button.run:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }

  .result {
    margin-top: 18px;
    border-radius: 10px;
    padding: 16px;
    font-size: 13.5px;
    line-height: 1.6;
    display: none;
  }

  .result.show { display: block; }

  .result.ok {
    background: var(--accent-soft);
    border: 1px solid #c5dad2;
    color: #1f4438;
  }

  .result.fail {
    background: var(--error-soft);
    border: 1px solid #e6c3ae;
    color: var(--error);
  }

  .result-title {
    font-weight: 700;
    margin-bottom: 4px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <p class="eyebrow">학원 자동화</p>
    <h1>학생별 페이지 생성</h1>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" data-type="assignment" role="tab">메인 과제</button>
    <button class="tab" data-type="attendance" role="tab">시간표(출석)</button>
    <button class="tab" data-type="notice" role="tab">메인 공지</button>
  </div>

  <div class="body">
    <p class="tab-desc" id="tabDesc">메인 과제 페이지 링크를 붙여넣으면 시간표에 연결된 학생들에게 과제수행 페이지를 생성합니다.</p>

    <label for="linkInput" id="linkLabel">메인 과제 페이지 링크</label>
    <input type="text" id="linkInput" placeholder="https://www.notion.so/... 링크를 붙여넣으세요" autocomplete="off">
    <p class="hint">Notion에서 해당 페이지를 열고 주소창(또는 공유 → 링크 복사)의 URL을 그대로 붙여넣으면 됩니다.</p>

    <button class="run" id="runBtn">실행</button>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle"></div>
      <div id="resultBody"></div>
    </div>
  </div>
</div>

<script>
  // ⚠️ 실제 배포한 Cloudflare Worker 주소로 교체하세요
  const WORKER_URL = 'https://student.clonote-tube.workers.dev/run';

  const TAB_CONFIG = {
    assignment: {
      label: '메인 과제 페이지 링크',
      desc: '메인 과제 페이지 링크를 붙여넣으면 시간표에 연결된 학생들에게 과제수행 페이지를 생성합니다.'
    },
    attendance: {
      label: '시간표 페이지 링크',
      desc: '시간표 페이지 링크를 붙여넣으면 등록 학생들에게 출석부 페이지를 생성합니다.'
    },
    notice: {
      label: '메인 공지 페이지 링크',
      desc: '메인 공지 페이지 링크를 붙여넣으면 연결된 수업의 학생들에게 학습내용(공지) 페이지를 생성합니다.'
    }
  };

  const tabs = document.querySelectorAll('.tab');
  const tabDesc = document.getElementById('tabDesc');
  const linkLabel = document.getElementById('linkLabel');
  const linkInput = document.getElementById('linkInput');
  const runBtn = document.getElementById('runBtn');
  const result = document.getElementById('result');
  const resultTitle = document.getElementById('resultTitle');
  const resultBody = document.getElementById('resultBody');

  let currentType = 'assignment';
  let autoHideTimer = null;

  function applyType(type) {
    currentType = type;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.type === type));
    tabDesc.textContent = TAB_CONFIG[type].desc;
    linkLabel.textContent = TAB_CONFIG[type].label;
    hideResult();
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => applyType(tab.dataset.type));
  });

  applyType('assignment');

  function hideResult() {
    clearTimeout(autoHideTimer);
    result.classList.remove('show', 'ok', 'fail');
  }

  function showResult(success, title, bodyHtml) {
    result.classList.add('show');
    result.classList.toggle('ok', success);
    result.classList.toggle('fail', !success);
    resultTitle.textContent = title;
    resultBody.innerHTML = bodyHtml;
  }

  runBtn.addEventListener('click', async () => {
    const link = linkInput.value.trim();
    if (!link) {
      showResult(false, '링크를 입력해주세요', '실행할 페이지의 Notion 링크를 붙여넣어 주세요.');
      return;
    }

    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner"></span>실행 중…';
    hideResult();

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: currentType, link: link })
      });
      const data = await res.json();

      if (data.ok) {
        showResult(true, '완료되었습니다',
          '생성 ' + (data.created ?? 0) + '건, 건너뜀 ' + (data.skipped ?? 0) + '건 (이미 있던 학생은 자동으로 제외됩니다)');
        linkInput.value = '';
        clearTimeout(autoHideTimer);
        autoHideTimer = setTimeout(hideResult, 6000);
      } else {
        showResult(false, '실행하지 못했습니다', escapeHtml(data.error || '알 수 없는 오류가 발생했습니다.'));
      }
    } catch (err) {
      showResult(false, '연결에 실패했습니다', '네트워크 상태를 확인하고 다시 시도해주세요.');
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = '실행';
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
