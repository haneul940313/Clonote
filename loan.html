<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#45824;&#52636; &#49345;&#54872; &#54788;&#54889;</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --ink: #202533;
      --muted: #70798b;
      --line: #e6ebf2;
      --track: #edf1f6;
      --green: #2dbb6f;
      --blue: #5d8df7;
      --yellow: #f4b942;
      --pink: #ef6f8f;
      --shadow: 0 14px 34px rgba(31, 42, 68, 0.09);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
    }

    .wrap {
      width: min(100%, 1120px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .header p {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .total {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .loan-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .loan-name {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .method {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      color: color-mix(in srgb, var(--accent) 76%, black);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .main {
      display: grid;
      grid-template-columns: 116px 1fr;
      gap: 16px;
      align-items: center;
    }

    .ring {
      position: relative;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--progress) * 1%), var(--track) 0);
      display: grid;
      place-items: center;
    }

    .ring::before {
      content: "";
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(230, 235, 242, 0.85);
    }

    .ring-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .ring-text strong {
      display: block;
      font-size: 25px;
      line-height: 1;
      letter-spacing: 0;
    }

    .ring-text span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .figures {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .figure {
      min-width: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .figure:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .figure span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .figure strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .next-date {
      margin-top: 16px;
      padding: 12px 13px;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      font-weight: 900;
    }

    .next-date span {
      color: var(--muted);
    }

    .state {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    @media (max-width: 980px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .loan-card {
        border-radius: 22px;
      }
    }

    @media (max-width: 380px) {
      .main {
        grid-template-columns: 1fr;
      }

      .ring {
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <p>&#45824;&#52636; &#49345;&#54872; &#54788;&#54889;</p>
        <h1>&#44058;&#50500;&#44032;&#45716; &#51473;</h1>
      </div>
      <div class="total" id="totalRemaining">&#48520;&#47084;&#50724;&#45716; &#51473;</div>
    </header>

    <section class="gallery" id="gallery" aria-label="loan repayment card list">
      <div class="state">&#45824;&#52636; &#51221;&#48372;&#47484; &#48520;&#47084;&#50724;&#44256; &#51080;&#50612;&#50836;</div>
    </section>
  </main>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSLrDmDLv87I4O9rEMyF7fZSMMvmsMLteiM9a9ANuYrtQBJo1tDtdCBzuO_azFJVM/exec';
    const ACCENTS = ['#2dbb6f', '#5d8df7', '#f4b942', '#ef6f8f', '#7a6ff0', '#2fb8b8'];
    const TEXT = {
      won: '\uC6D0',
      noSchedule: '\uC0C1\uD658 \uC608\uC815 \uC5C6\uC74C',
      loadFail: '\uB300\uCD9C \uC815\uBCF4\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC5B4\uC694.',
      totalRemaining: '\uC804\uCCB4 \uC794\uC5EC \uAE08\uC561 ',
      noLoans: '\uD45C\uC2DC\uD560 \uB300\uCD9C\uC774 \uC5C6\uC5B4\uC694',
      loan: '\uB300\uCD9C',
      repaid: '\uC0C1\uD658\uD55C \uAE08\uC561',
      remaining: '\uC794\uC5EC \uAE08\uC561',
      complete: '\uC0C1\uD658 \uC644\uB8CC',
      nextPayment: '\uB2E4\uC74C \uC0C1\uD658\uC77C',
      loadingFailed: '\uBD88\uB7EC\uC624\uAE30 \uC2E4\uD328',
      scriptFail: 'Apps Script \uC751\uB2F5\uC744 \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC5B4\uC694.'
    };

    const gallery = document.getElementById('gallery');
    const totalRemaining = document.getElementById('totalRemaining');

    function formatWon(value) {
      return Math.round(Number(value || 0)).toLocaleString('ko-KR') + TEXT.won;
    }

    function formatDate(value) {
      if (!value) return TEXT.noSchedule;
      return String(value).replaceAll('-', '.');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderLoans(data) {
      if (!data || !data.ok) {
        renderError(data && data.error ? data.error : TEXT.loadFail);
        return;
      }

      const loans = Array.isArray(data.loans) ? data.loans : [];
      totalRemaining.textContent = TEXT.totalRemaining + formatWon(data.totalRemainingAmount);

      if (loans.length === 0) {
        gallery.innerHTML = '<div class="state">' + TEXT.noLoans + '</div>';
        return;
      }

      gallery.innerHTML = loans.map((loan, index) => {
        const accent = ACCENTS[index % ACCENTS.length];
        const progress = Math.max(0, Math.min(Number(loan.progressPercent || 0), 100));
        const method = loan.method || loan.term || TEXT.loan;
        return `
          <article class="loan-card" style="--progress: ${progress}; --accent: ${accent};">
            <div class="card-top">
              <h2 class="loan-name">${escapeHtml(loan.name)}</h2>
              <div class="method">${escapeHtml(method)}</div>
            </div>
            <div class="main">
              <div class="ring" aria-label="${progress}% ${TEXT.complete}">
                <div class="ring-text">
                  <div>
                    <strong>${progress}%</strong>
                    <span>${TEXT.complete}</span>
                  </div>
                </div>
              </div>
              <div class="figures">
                <div class="figure">
                  <span>${TEXT.repaid}</span>
                  <strong>${formatWon(loan.paidAmount)}</strong>
                </div>
                <div class="figure">
                  <span>${TEXT.remaining}</span>
                  <strong>${formatWon(loan.remainingAmount)}</strong>
                </div>
              </div>
            </div>
            <div class="next-date">
              <span>${TEXT.nextPayment}</span>
              <strong>${escapeHtml(formatDate(loan.nextPaymentDate))}</strong>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderError(message) {
      totalRemaining.textContent = TEXT.loadingFailed;
      gallery.innerHTML = '<div class="state">' + escapeHtml(message) + '</div>';
    }

    function loadLoans() {
      const callbackName = '__loanRepaymentWidget_' + Date.now();
      const script = document.createElement('script');
      const separator = APPS_SCRIPT_URL.includes('?') ? '&' : '?';

      window[callbackName] = function (data) {
        renderLoans(data);
        script.remove();
        delete window[callbackName];
      };

      script.onerror = function () {
        renderError(TEXT.scriptFail);
        script.remove();
        delete window[callbackName];
      };

      script.src = APPS_SCRIPT_URL + separator + 'action=loans&callback=' + encodeURIComponent(callbackName);
      document.head.appendChild(script);
    }

    loadLoans();
  </script>
</body>
</html>
