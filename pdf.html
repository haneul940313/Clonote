<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>거래명세서</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2f3f5;
      color: #111;
      font-family: Arial, "Malgun Gothic", sans-serif;
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .toolbar input,
    .toolbar select,
    .toolbar button {
      height: 34px;
      border: 1px solid #aaa;
      background: #fff;
      padding: 0 10px;
      font-size: 13px;
    }

    .toolbar button {
      cursor: pointer;
      font-weight: 700;
    }

    .toolbar .primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .status {
      padding: 8px 12px;
      color: #555;
      font-size: 12px;
    }

    .paper-wrap {
      padding: 16px;
      overflow-x: auto;
    }

    .paper {
      width: 190mm;
      min-height: 270mm;
      margin: 0 auto;
      padding: 6mm;
      background: #fff;
      border: 1px solid #ddd;
    }

    .title {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 9px;
      text-decoration: underline;
      text-underline-offset: 7px;
      margin: 1mm 0 8mm;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td,
    th {
      border: 1px solid #222;
      height: 24px;
      padding: 3px 5px;
      vertical-align: middle;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    th {
      font-weight: 800;
      text-align: center;
    }

    .top-area {
      display: grid;
      grid-template-columns: 35% 65%;
      gap: 8px;
      margin-bottom: 0;
    }

    .left-box {
      height: 118px;
      position: relative;
      border: 1px solid #222;
      border-right: 0;
    }

    .left-box .date-line {
      position: absolute;
      top: 8px;
      left: 8px;
      font-weight: 700;
    }

    .left-box .to-line {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 34px;
      border-bottom: 1px solid #222;
      text-align: right;
      padding-right: 4px;
      font-weight: 700;
      height: 24px;
    }

    .supplier-table td {
      height: 29px;
    }

    .vertical {
      width: 28px;
      text-align: center;
      font-weight: 800;
      background: #e8f7fb;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 2px;
    }

    .label {
      width: 90px;
      text-align: center;
      font-weight: 800;
      background: #fff;
    }

    .stamp {
      text-align: right;
      color: #555;
    }

    .amount-line td {
      height: 30px;
      font-weight: 800;
    }

    .amount-label {
      width: 118px;
      text-align: center;
    }

    .amount-korean {
      text-align: right;
      padding-right: 14px;
      background: #eebfc0;
    }

    .amount-won {
      width: 130px;
      text-align: right;
      padding-right: 8px;
      background: #eebfc0;
    }

    .items th {
      background: #e8f7fb;
    }

    .items th,
    .items td {
      height: 24px;
    }

    .no { width: 42px; text-align: center; }
    .date { width: 64px; text-align: center; }
    .name { width: auto; }
    .type { width: 82px; text-align: center; }
    .qty { width: 56px; text-align: right; }
    .money { width: 108px; text-align: right; }

    .amount-col {
      background: #eebfc0;
    }

    .summary-wrap {
      display: grid;
      grid-template-columns: 1fr 200px;
      margin-top: -1px;
    }

    .memo {
      border: 1px solid #222;
      border-top: 0;
      min-height: 76px;
      padding: 8px;
      font-weight: 800;
      font-size: 15px;
    }

    .summary td {
      height: 25px;
      font-weight: 800;
    }

    .summary-label {
      width: 80px;
      text-align: center;
      background: #e8f7fb;
    }

    .summary-money {
      text-align: right;
      padding-right: 8px;
      background: #eebfc0;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 42px 0;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 7mm;
      }

      body {
        background: #fff;
      }

      .toolbar,
      .status {
        display: none !important;
      }

      .paper-wrap {
        padding: 0;
        overflow: visible;
      }

      .paper {
        width: 196mm;
        min-height: auto;
        margin: 0;
        padding: 0;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="monthInput" type="month" />
    <button class="primary" onclick="loadMonth()">파일 생성하기</button>
    <select id="groupSelect" onchange="renderStatement()">
      <option value="">거래처/담당자 선택</option>
    </select>
    <button onclick="window.print()">PDF 다운로드 받기</button>
  </div>

  <div id="status" class="status">월을 선택한 뒤 파일 생성하기를 눌러줘.</div>

  <div class="paper-wrap">
    <div id="paper" class="paper">
      <div class="empty">거래명세서가 여기에 표시됩니다.</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxIjy992knS4x3_pRks1F_aZIrLU1GfyDVQsomsPG4anq0Rf6rclj0V-VurTYBQJz69/exec';

    const state = {
      month: '',
      sites: [],
      groups: [],
    };

    const $ = (id) => document.getElementById(id);

    init();

    function init() {
      const now = new Date();
      $('monthInput').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    async function loadMonth() {
      state.month = $('monthInput').value;

      if (!state.month) {
        setStatus('월을 먼저 선택해줘.');
        return;
      }

      setStatus('노션 데이터를 불러오는 중...');
      $('paper').innerHTML = '<div class="empty">불러오는 중...</div>';

      try {
        const data = await fetchJson(`${WEB_APP_URL}?action=sites&month=${encodeURIComponent(state.month)}`);

        if (!data.ok) throw new Error(data.error || '데이터를 불러오지 못했습니다.');

        state.sites = (data.sites || []).filter((site) => site.paid !== true);
        state.groups = buildGroups(state.sites);

        renderGroupOptions();

        if (!state.groups.length) {
          $('paper').innerHTML = '<div class="empty">해당 월의 미결제 데이터가 없습니다.</div>';
          setStatus('해당 월의 미결제 데이터가 없습니다.');
          return;
        }

        $('groupSelect').value = state.groups[0].key;
        renderStatement();
        setStatus(`${state.month} / 미결제 ${state.sites.length}건 / ${state.groups.length}개 그룹`);
      } catch (err) {
        $('paper').innerHTML = '<div class="empty">오류가 발생했습니다.</div>';
        setStatus(err.message || String(err));
      }
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      const text = await res.text();

      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error('Apps Script 응답이 JSON이 아닙니다: ' + text.slice(0, 120));
      }
    }

    function buildGroups(sites) {
      const map = new Map();

      sites.forEach((site) => {
        const contacts = Array.isArray(site.contacts) && site.contacts.length
          ? site.contacts
          : [{ id: 'none', name: '미지정', type: '', phone: '' }];

        contacts.forEach((contact) => {
          const key = contact.id || contact.name || 'none';

          if (!map.has(key)) {
            map.set(key, {
              key,
              contact,
              sites: [],
            });
          }

          map.get(key).sites.push(site);
        });
      });

      return Array.from(map.values()).sort((a, b) => {
        return String(a.contact.name || '').localeCompare(String(b.contact.name || ''), 'ko');
      });
    }

    function renderGroupOptions() {
      const html = ['<option value="">거래처/담당자 선택</option>'];

      state.groups.forEach((group) => {
        const label = `${group.contact.name || '미지정'}${group.contact.type ? ' / ' + group.contact.type : ''}`;
        html.push(`<option value="${escapeHtml(group.key)}">${escapeHtml(label)}</option>`);
      });

      $('groupSelect').innerHTML = html.join('');
    }

    function renderStatement() {
      const group = state.groups.find((item) => item.key === $('groupSelect').value);

      if (!group) {
        $('paper').innerHTML = '<div class="empty">거래처/담당자를 선택해줘.</div>';
        return;
      }

      const rows = buildRows(group.sites);
      const supply = rows.reduce((sum, row) => sum + row.supplyAmount, 0);
      const vat = Math.round(supply * 0.1);
      const total = supply + vat;

      const customerName = group.contact.name || '';
      const customerPhone = group.contact.phone || '';

      $('paper').innerHTML = `
        <div class="title">거래명세서</div>

        <div class="top-area">
          <div class="left-box">
            <div class="date-line">날짜 : ${formatKoreanDate(new Date())}</div>
            <div class="to-line">${escapeHtml(customerName)} 귀하</div>
          </div>

          <table class="supplier-table">
            <tr>
              <td class="vertical" rowspan="4">공급자</td>
              <td class="label">사업자등록번호</td>
              <td colspan="3"></td>
            </tr>
            <tr>
              <td class="label">상호</td>
              <td>보양의 신</td>
              <td class="label">대표자</td>
              <td class="stamp">(인)</td>
            </tr>
            <tr>
              <td class="label">전화번호</td>
              <td colspan="3"></td>
            </tr>
            <tr>
              <td class="label">주소</td>
              <td colspan="3"></td>
            </tr>
          </table>
        </div>

        <table class="amount-line">
          <tr>
            <td class="amount-label">합계금액 :</td>
            <td class="amount-korean">${escapeHtml(numberToKorean(total))} 원 정</td>
            <td class="amount-won">₩ ${formatMoney(total)}</td>
          </tr>
        </table>

        <table class="items">
          <thead>
            <tr>
              <th class="date">날짜</th>
              <th class="name">품명 / 규격</th>
              <th class="type">단위</th>
              <th class="qty">수량</th>
              <th class="money">단가</th>
              <th class="money amount-col">금액</th>
              <th class="money amount-col">부가세</th>
              <th class="money amount-col">합계금액</th>
            </tr>
          </thead>
          <tbody>
            ${renderRows(rows)}
          </tbody>
        </table>

        <div class="summary-wrap">
          <div class="memo">비 고</div>
          <table class="summary">
            <tr>
              <td class="summary-label">공급가</td>
              <td class="summary-money">₩ ${formatMoney(supply)}</td>
            </tr>
            <tr>
              <td class="summary-label">부가세</td>
              <td class="summary-money">₩ ${formatMoney(vat)}</td>
            </tr>
            <tr>
              <td class="summary-label">합계금액</td>
              <td class="summary-money">₩ ${formatMoney(total)}</td>
            </tr>
          </table>
        </div>
      `;
    }

    function buildRows(sites) {
      return sites.map((site, index) => {
        const supplyAmount = Number(site.totalAmount || 0);
        const vat = Math.round(supplyAmount * 0.1);

        return {
          no: index + 1,
          date: site.slipDate || site.startDate || '',
          name: site.title || '',
          type: arrayText(site.items) || site.constructionType || '',
          quantity: 1,
          unitPrice: supplyAmount,
          supplyAmount,
          vat,
          total: supplyAmount + vat,
        };
      });
    }

    function renderRows(rows) {
      const lines = rows.slice();

      while (lines.length < 16) {
        lines.push(null);
      }

      return lines.map((row) => {
        if (!row) {
          return `
            <tr>
              <td class="date"></td>
              <td class="name"></td>
              <td class="type"></td>
              <td class="qty"></td>
              <td class="money"></td>
              <td class="money amount-col">-</td>
              <td class="money amount-col">-</td>
              <td class="money amount-col">-</td>
            </tr>
          `;
        }

        return `
          <tr>
            <td class="date">${escapeHtml(formatShortDate(row.date))}</td>
            <td class="name">${escapeHtml(row.name)}</td>
            <td class="type">${escapeHtml(row.type)}</td>
            <td class="qty">${row.quantity}</td>
            <td class="money">₩ ${formatMoney(row.unitPrice)}</td>
            <td class="money amount-col">₩ ${formatMoney(row.supplyAmount)}</td>
            <td class="money amount-col">₩ ${formatMoney(row.vat)}</td>
            <td class="money amount-col">₩ ${formatMoney(row.total)}</td>
          </tr>
        `;
      }).join('');
    }

    function arrayText(value) {
      return Array.isArray(value) ? value.join(', ') : String(value || '');
    }

    function formatMoney(value) {
      return Math.round(Number(value || 0)).toLocaleString('ko-KR');
    }

    function formatShortDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function formatKoreanDate(date) {
      return `${date.getFullYear()}년 ${String(date.getMonth() + 1).padStart(2, '0')}월 ${String(date.getDate()).padStart(2, '0')}일`;
    }

    function numberToKorean(value) {
      const num = Math.round(Number(value || 0));
      if (!num) return '영';

      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const small = ['', '십', '백', '천'];
      const big = ['', '만', '억', '조'];
      const parts = [];
      let source = String(num);
      let groupIndex = 0;

      while (source.length > 0) {
        const chunk = source.slice(-4);
        source = source.slice(0, -4);

        let text = '';
        const padded = chunk.padStart(4, '0');

        for (let i = 0; i < 4; i++) {
          const n = Number(padded[i]);
          if (!n) continue;
          text += digits[n] + small[3 - i];
        }

        if (text) {
          parts.unshift(text + big[groupIndex]);
        }

        groupIndex++;
      }

      return parts.join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setStatus(message) {
      $('status').textContent = message;
    }
  </script>
</body>
</html>
